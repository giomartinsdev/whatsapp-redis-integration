version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    ports:
      - "6379:6379"

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8002:5540"

  api:
    image: ${REGISTRY_URL}/whatsapp-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: python src/api/main.py
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - CLF_SERVICE_TOKEN_CLIENT_ID=${CLF_SERVICE_TOKEN_CLIENT_ID}
      - CLF_SERVICE_TOKEN_CLIENT_SECRET=${CLF_SERVICE_TOKEN_CLIENT_SECRET}
    ports:
      - "5001:5000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./src:/app/src

  worker:
    image: ${REGISTRY_URL}/whatsapp-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: python src/worker/main.py
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - CLF_SERVICE_TOKEN_CLIENT_ID=${CLF_SERVICE_TOKEN_CLIENT_ID}
      - CLF_SERVICE_TOKEN_CLIENT_SECRET=${CLF_SERVICE_TOKEN_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    volumes:
      - ./src:/app/src

  whatsapp_node:
    image: ${REGISTRY_URL}/whatsapp-node:latest
    build:
      context: ./src/whatsapp_worker
      dockerfile: Dockerfile
    environment:
      - API_URL=${API_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - CLF_SERVICE_TOKEN_CLIENT_ID=${CLF_SERVICE_TOKEN_CLIENT_ID}
      - CLF_SERVICE_TOKEN_CLIENT_SECRET=${CLF_SERVICE_TOKEN_CLIENT_SECRET}
    ports:
      - "3000:3000"
    restart: unless-stopped
